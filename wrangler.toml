name = "operatie-mysterieweekend"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# De gebouwde app (dist/) wordt door dezelfde Worker geserveerd; /api/* gaat eerst langs de code.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Gedeelde opslag (gokken, kas, playlist, scores, foto's).
# Maak hem aan met: npx wrangler kv namespace create DATA  en plak het id hieronder.
[[kv_namespaces]]
binding = "DATA"
id = "VUL_HIER_HET_KV_ID_IN"

# Geheimen (REVEAL_B64, ORG_HASH, GROEP_HASH) staan NIET hier,
# maar worden geüpload met: npm run geheim:upload
